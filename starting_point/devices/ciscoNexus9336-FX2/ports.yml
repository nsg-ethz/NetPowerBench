      enable:
        - interface INTERFACE_LABEL
        - speed SPEED_LABEL
        - no shutdown
        - exit
      disable:
        - interface INTERFACE_LABEL
        - no speed SPEED_LABEL
        - no switchport
        - shutdown
        - exit
