# DUT parameters
DUT:
  id: "ciscoNCS55A1-24H"
  port_file: "ports.yml"
  transceivers: "PCC"
  type: "router"
  needs_commit: True # Does OS require commit to apply configs
  
# Measurement parameters
measurement_time_s: 30   # in seconds
configuration_time_s: 0      # in seconds, also serves as warm-up interval for the traffic generation
wait_factor_short_s: 0.1  # Factors that gets multiplied with the number of ports impacted
wait_factor_long_s: 0.2
sampling_interval_ms: 100   # in milliseconds
random_seed:                  # leave empty for uncontrolled seed

# External dependencies
pinpoint:
  binary: "/local/home/psteinebrunn/pinpoint/build/pinpoint"
  workload: # currently unused
serial_port: "/dev/ttyUSB0"
baudrate: 115200
counter_1: mcp:dev0ch1
counter_2: mcp:dev0ch2
